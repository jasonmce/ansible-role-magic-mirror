---
# Restore generated lockfiles without discarding module source changes.
- name: "Module path exists"
  stat:
    path: "{{ mm_root }}/modules/{{ item.name }}"
  register: register_module_path

- name: "Restore tracked lockfiles for {{ item.name }}"
  ansible.builtin.shell:
    cmd: git ls-files -z -- '*-lock.json' | xargs -0 --no-run-if-empty git restore --worktree --
    chdir: "{{ mm_root }}/modules/{{ item.name }}"
  when: register_module_path.stat.exists

- name: "Download Module {{ item.name }}"
  ansible.builtin.git:
    repo: "{{ item.github }}"
    dest: "{{ mm_root }}/modules/{{ item.name }}"
    clone: yes
    force: no
    update: yes

- name: "Check dependency manifest for {{ item.name }}"
  ansible.builtin.stat:
    path: "{{ mm_root }}/modules/{{ item.name }}/package.json"
  register: module_package

- name: "NPM Install Module {{ item.name }}"
  ansible.builtin.npm:
    path: "{{ mm_root }}/modules/{{ item.name }}"
  when: module_package.stat.exists
